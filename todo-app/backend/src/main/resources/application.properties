spring.application.name=todo-manager
server.port=${PORT:8080}

# CORS: which frontend origins may call the API (comma separated). * = any (fine for development)
app.cors.allowed-origins=${CORS_ORIGINS:*}

# Database: H2 (SQL) stored in a file so tasks stay after restart
spring.datasource.url=jdbc:h2:file:./data/taskdb
spring.datasource.username=root
spring.datasource.password=1234
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

logging.level.com.example.todo=INFO
